name: windows

on:
  push:
    branches: [win, 'codex/platform-*']
  pull_request:
    branches: [win]
  workflow_dispatch:
    inputs:
      architecture:
        description: Target architecture
        type: choice
        options: [all, x64, arm64]
        default: all
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.architecture || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref != 'refs/heads/ci/mcp-cache-hints-route-tests-20261104' && github.ref != 'refs/heads/ci/mcp-cache-hints-exe-process-20261105'
    name: build (${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    env:
      SWIFT_VERSION: 6.3.3
      TARGET_TRIPLE: ${{ matrix.architecture == 'arm64' && 'aarch64-unknown-windows-msvc' || 'x86_64-unknown-windows-msvc' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x64' && '["x64"]' || '["x64","arm64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exclude build directories from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE "Packages")
          Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE ".build")
          Add-MpPreference -ExclusionProcess "swift-frontend.exe"
          Add-MpPreference -ExclusionProcess "swift.exe"
          Add-MpPreference -ExclusionProcess "clang.exe"
          Add-MpPreference -ExclusionProcess "lld-link.exe"
      - name: Restore Swift installer cache
        id: swift-installer-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/swift-downloads
          key: windows-swift-installer-v2-${{ env.SWIFT_VERSION }}-${{ runner.arch }}
      - name: Install Swift toolchain
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\setup-windows-swift.ps1" -Version $env:SWIFT_VERSION'
      - name: Save Swift installer cache
        if: steps.swift-installer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/swift-downloads
          key: ${{ steps.swift-installer-cache.outputs.cache-primary-key }}
      - name: Prepare WiX runtime extraction tools
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\setup-windows-wix.ps1"'
      - name: Validate Swift portable runtime
        shell: pwsh
        run: |
          $scriptRoot = Join-Path $env:GITHUB_WORKSPACE "Scripts"
          . (Join-Path $scriptRoot "windows-portable-support.ps1")
          . (Join-Path $scriptRoot "windows-portable-runtime.ps1")
          $architecture = "${{ matrix.architecture }}"
          $expectedMachine = if ($architecture -eq "x64") { [UInt16]0x8664 } else { [UInt16]0xAA64 }
          $temporaryRoot = Join-Path $env:RUNNER_TEMP ("swift-runtime-" + [Guid]::NewGuid().ToString("N"))
          try {
            $modulePath = Resolve-SwiftRuntimeMergeModule $architecture
            Expand-SwiftRuntimeMergeModule $modulePath $temporaryRoot
            $swiftCore = @(Get-ChildItem -LiteralPath $temporaryRoot -File -Recurse -Filter "swiftCore.dll")
            if ($swiftCore.Count -ne 1 -or (Get-PEMachine $swiftCore[0].FullName) -ne $expectedMachine) {
              throw "Swift runtime merge module did not contain the expected swiftCore.dll."
            }
            Write-Host "Validated $modulePath"
          } finally {
            if (Test-Path -LiteralPath $temporaryRoot) {
              Remove-Item -LiteralPath $temporaryRoot -Recurse -Force
            }
          }
      - name: Identify vcpkg cache
        id: vcpkg-cache-key
        shell: pwsh
        run: |
          $revision = & git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_OUTPUT "revision=$revision"
          Add-Content $env:GITHUB_OUTPUT "image=$env:ImageVersion"
          $cachePath = Join-Path $env:GITHUB_WORKSPACE ".build\ci-cache\vcpkg"
          New-Item -ItemType Directory -Path $cachePath -Force | Out-Null
          Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$cachePath,readwrite"
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/ci-cache/vcpkg
          key: windows-vcpkg-v1-${{ matrix.architecture }}-windows-${{ steps.vcpkg-cache-key.outputs.image }}-${{ steps.vcpkg-cache-key.outputs.revision }}
      - name: Install SQLite via vcpkg (for GRDB)
        shell: pwsh
        run: |
          $triplet = "${{ matrix.architecture }}-windows"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "sqlite3:$triplet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archDir = "${{ matrix.architecture }}"
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath | Select-Object -First 1
          . "$env:GITHUB_WORKSPACE\Scripts\windows-build-environment.ps1"
          $buildEnvironment = Get-WindowsBuildEnvironment -Architecture $archDir
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT\installed\$triplet"
          $vcpkgBin = Join-Path $vcpkgRoot "bin"
          $includePaths = @((Join-Path $vcpkgRoot "include")) + $buildEnvironment.IncludePaths
          Add-Content $env:GITHUB_ENV "INCLUDE=$($includePaths -join ';')"
          $targetLibraryPaths = (@((Join-Path $vcpkgRoot "lib")) + $buildEnvironment.LibraryPaths) -join ";"
          Add-Content $env:GITHUB_ENV "TARGET_LIBRARY_PATHS=$targetLibraryPaths"
          . "$env:GITHUB_WORKSPACE\Scripts\windows-portable-support.ps1"
          $expectedMachine = if ($archDir -eq "arm64") { [UInt16]0xAA64 } else { [UInt16]0x8664 }
          if ((Get-PEMachine (Join-Path $vcpkgBin "sqlite3.dll")) -ne $expectedMachine) {
            throw "SQLite runtime architecture does not match $archDir."
          }
          $vcRedistRoot = Get-ChildItem "$vsRoot\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match "^[0-9]+(?:\.[0-9]+)+$" } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $vcRedistRoot) { throw "Visual C++ Redistributable files are unavailable." }
          Add-Content $env:GITHUB_ENV "CODEX_BRIDGE_VC_REDIST_ROOT=$vcRedistRoot"
          Write-Host "LIB=$targetLibraryPaths"
          Add-Content $env:GITHUB_ENV "LIB=$targetLibraryPaths"
          if (-not (Test-Path (Join-Path $vcpkgBin "sqlite3.dll"))) {
            throw "SQLite runtime is unavailable: $vcpkgBin\sqlite3.dll"
          }
          Add-Content $env:GITHUB_PATH $vcpkgBin
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/ci-cache/vcpkg
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Compile Windows application resources
        shell: pwsh
        run: |
          $resourceOutput = Join-Path $env:GITHUB_WORKSPACE ".build\windows-resources\CodexBridgeWindowsApp.res"
          & "$env:GITHUB_WORKSPACE\Scripts\compile-windows-resources.ps1" -OutputPath $resourceOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "CODEX_BRIDGE_WINDOWS_RESOURCE=$resourceOutput"
      - name: Restore SwiftPM dependency repositories
        id: swift-dependencies-cache
        uses: actions/cache/restore@v6
        with:
          path: Packages/BridgeCore/.build/repositories
          key: windows-swift-repositories-v1-${{ hashFiles('Packages/BridgeCore/Package.resolved', 'Vendor/swift-sdk/Package.resolved') }}
          restore-keys: windows-swift-repositories-v1-
      - name: Resolve SwiftPM dependencies
        shell: pwsh
        run: |
          swift package --package-path Packages/BridgeCore resolve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save SwiftPM dependency repositories
        if: steps.swift-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: Packages/BridgeCore/.build/repositories
          key: ${{ steps.swift-dependencies-cache.outputs.cache-primary-key }}
      - name: Build service and Windows shell
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targetTriple = $env:TARGET_TRIPLE
          . "$env:GITHUB_WORKSPACE\Scripts\windows-swift-arguments.ps1"
          $swiftArguments = @(Get-WindowsSwiftArguments `
            -VcpkgInstalledRoot "$env:VCPKG_INSTALLATION_ROOT\installed\${{ matrix.architecture }}-windows" `
            -TargetTriple $targetTriple -LibraryPaths ($env:TARGET_LIBRARY_PATHS -split ";"))
          $buildArguments = @($swiftArguments) + @("-c", "release")
          swift build @buildArguments --product codex-bridge-windows-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build @buildArguments --product codex-bridge-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binPathOutput = & swift build @buildArguments --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binPath = ($binPathOutput | Select-Object -Last 1).ToString().Trim()
          if (-not $binPath) { throw "Swift build output directory was empty." }
          Add-Content $env:GITHUB_ENV "SWIFT_BIN_PATH=$binPath"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify installed Agent CLI contracts
        shell: pwsh
        timeout-minutes: 10
        run: |
          node Scripts/verify-agent-runtime-resources.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node Scripts/verify-agent-runtime-resources.mjs "$env:SWIFT_BIN_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($piVersion in @("0.87.1", "1.0.3", "1.4.0")) {
            $piRoot = ".build/pi-contract/$piVersion"
            npm install --prefix $piRoot --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$piVersion"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node Scripts/verify-pi-cli-contract.mjs $piRoot $piVersion
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          npm install --prefix .build/agent-contract --ignore-scripts --no-audit --no-fund @qodercn-ai/qoderclicn@1.1.80 @qodercn-ai/qodercn-agent-sdk@1.0.56
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import { execFileSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';
          import path from 'node:path';
          import { SDKProcessOwner } from '../../Packages/BridgeCore/Sources/BridgeQoderSDK/Resources/QoderHost/process.mjs';
          import { isSDKAuthenticationError } from '../../Packages/BridgeCore/Sources/BridgeQoderSDK/Resources/QoderHost/sdk.mjs';
          const root = path.resolve('.build/agent-contract');
          const modules = path.join(root, 'node_modules');
          const cli = path.join(modules, '@qodercn-ai/qoderclicn/bundle/qoderclicn.js');
          console.log('Qoder CN CLI:', execFileSync(process.execPath, [cli, '--version'], { encoding: 'utf8' }).trim());
          const sdk = await import(pathToFileURL(path.join(modules, '@qodercn-ai/qodercn-agent-sdk/dist/index.js')));
          const owner = new SDKProcessOwner();
          let authRequired = false;
          let warm;
          try {
            warm = await sdk.startup({ initializeTimeoutMs: 30000, options: {
              auth: sdk.qodercliAuth(), transport: sdk.ProcessTransport.default,
              executable: process.execPath, pathToQoderCLIExecutable: cli, cwd: root,
              settingSources: [], tools: [], persistSession: false,
              spawnQoderCLIProcess: options => owner.spawn(options),
              onAuthExpired: () => { authRequired = true; },
            } });
            console.log('Qoder CN native SDK initialization: passed');
          } catch (error) {
            if (!authRequired && !isSDKAuthenticationError(error)) throw error;
            console.log('Qoder CN native SDK reached authentication; inference requires a signed-in account');
          } finally { if (warm) await warm.close(); await owner.close(); }
          '@ | Set-Content -LiteralPath .build/agent-contract/verify.mjs -Encoding utf8
          node .build/agent-contract/verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore Tunnel helper cache
        id: tunnel-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/tunnel-client/${{ matrix.architecture }}
          key: windows-tunnel-v1-${{ matrix.architecture }}-${{ hashFiles('Scripts/stage-windows-tunnel-client.ps1') }}
      - name: Stage Windows tunnel client
        shell: pwsh
        run: |
          $tunnelClientDir = Join-Path $env:GITHUB_WORKSPACE ".build\tunnel-client\${{ matrix.architecture }}"
          & "$env:GITHUB_WORKSPACE\Scripts\stage-windows-tunnel-client.ps1" `
            -Architecture "${{ matrix.architecture }}" `
            -Destination $tunnelClientDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Tunnel helper cache
        if: steps.tunnel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/tunnel-client/${{ matrix.architecture }}
          key: ${{ steps.tunnel-cache.outputs.cache-primary-key }}
      - name: Stage Windows portable package
        shell: pwsh
        run: |
          $targetTriple = $env:TARGET_TRIPLE
          $portableDir = Join-Path $env:GITHUB_WORKSPACE ".build\windows-dist\${{ matrix.architecture }}"
          # The helper directory is derived here instead of being forwarded
          # through GITHUB_ENV, so a package can never be staged without it.
          $tunnelClientDir = Join-Path $env:GITHUB_WORKSPACE ".build\tunnel-client\${{ matrix.architecture }}"
          foreach ($required in @("tunnel-client.exe", "tunnel-client.sha256")) {
            if (-not (Test-Path -LiteralPath (Join-Path $tunnelClientDir $required) -PathType Leaf)) {
              throw "Staged Tunnel helper is incomplete: $tunnelClientDir\$required"
            }
          }
          $stageArguments = @{
            BinPath = $env:SWIFT_BIN_PATH
            OutDir = $portableDir
            Architecture = "${{ matrix.architecture }}"
            VcpkgTriplet = "${{ matrix.architecture }}-windows"
            TunnelClientDir = $tunnelClientDir
          }
          if ($targetTriple) {
            $stageArguments["TargetTriple"] = $targetTriple
          }
          & "$env:GITHUB_WORKSPACE\Scripts\stage-windows-portable.ps1" @stageArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Inno Setup 7.1.0
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\install-inno-setup.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows EXE installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\build-windows-installer.ps1" `
            -Architecture "${{ matrix.architecture }}" `
            -PayloadDir "$env:GITHUB_WORKSPACE\.build\windows-dist\${{ matrix.architecture }}" `
            -OutputDir "$env:GITHUB_WORKSPACE\.build\windows-installer\${{ matrix.architecture }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows installer
        timeout-minutes: 10
        shell: pwsh
        run: |
          $installerRoot = "$env:GITHUB_WORKSPACE\.build\windows-installer\${{ matrix.architecture }}"
          $installers = @(Get-ChildItem -LiteralPath $installerRoot -Filter "*-Setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one EXE installer." }
          & "$env:GITHUB_WORKSPACE\.github\scripts\verify-windows-installer.ps1" `
            -InstallerPath $installers[0].FullName -Architecture "${{ matrix.architecture }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: codex-bridge-windows-${{ matrix.architecture }}
          path: .build/windows-dist/codex-bridge-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error
      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: codex-bridge-windows-${{ matrix.architecture }}-installer
          path: |
            .build/windows-installer/${{ matrix.architecture }}/*-Setup.exe
            .build/windows-installer/${{ matrix.architecture }}/*-Setup.exe.sha256
            .build/windows-installer/${{ matrix.architecture }}/INSTALLER-BUILD-INFO.json
          if-no-files-found: error

  # Temporary regression job, gated to this branch and manual x64 dispatch only.
  mcp-route-tests:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/mcp-cache-hints-route-tests-20261104' && inputs.architecture == 'x64'
    name: MCP route regression (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SWIFT_VERSION: 6.3.3
      TARGET_TRIPLE: x86_64-unknown-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Swift toolchain
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\setup-windows-swift.ps1" -Version $env:SWIFT_VERSION'
      - name: Prepare Windows Swift test libraries
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne "X64") {
            throw "The MCP route test job requires a Windows x64 runner."
          }
          $triplet = "x64-windows"
          $vcpkgRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$triplet"
          $vcpkgOutput = & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "sqlite3:$triplet" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "ERROR_CATEGORY=vcpkg_sqlite_setup"
            exit 1
          }
          . "$env:GITHUB_WORKSPACE\Scripts\windows-build-environment.ps1"
          $buildEnvironment = Get-WindowsBuildEnvironment -Architecture "x64"
          $includePaths = @((Join-Path $vcpkgRoot "include")) + $buildEnvironment.IncludePaths
          $libraryPaths = @((Join-Path $vcpkgRoot "lib")) + $buildEnvironment.LibraryPaths
          Add-Content $env:GITHUB_ENV "INCLUDE=$($includePaths -join ';')"
          Add-Content $env:GITHUB_ENV "TARGET_LIBRARY_PATHS=$($libraryPaths -join ';')"
          Add-Content $env:GITHUB_ENV "LIB=$($libraryPaths -join ';')"
          Add-Content $env:GITHUB_PATH (Join-Path $vcpkgRoot "bin")
          Write-Output "WINDOWS_TEST_LIBRARY_SETUP=PASS"
      - name: Resolve pinned SwiftPM dependencies
        shell: pwsh
        run: |
          $resolveOutput = & swift package --package-path Packages/BridgeCore resolve 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "ERROR_CATEGORY=swift_dependency_resolution"
            exit 1
          }
          Write-Output "SWIFTPM_RESOLVE_STATUS=PASS"
      - name: Set temporary MCP response capture directory
        shell: pwsh
        run: |
          $captureDirectory = Join-Path $env:RUNNER_TEMP "codex-bridge-mcp-captures"
          New-Item -ItemType Directory -Path $captureDirectory -Force | Out-Null
          Add-Content $env:GITHUB_ENV "CODEX_BRIDGE_MCP_CAPTURE_DIR=$captureDirectory"
          Write-Output "CAPTURE_STORAGE=runner-temp-only"
      - name: Run discovered Swift MCP route tests
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\Scripts\windows-swift-arguments.ps1"
          $baseArguments = Get-WindowsSwiftArguments -VcpkgInstalledRoot "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" -TargetTriple $env:TARGET_TRIPLE -LibraryPaths ($env:TARGET_LIBRARY_PATHS -split ";")
          $swiftArguments = @($baseArguments) + @("-c", "debug", "--filter", "MCPModernResponse")
          $swiftOutput = @(& swift test @swiftArguments 2>&1)
          $swiftExitCode = $LASTEXITCODE
          function ConvertTo-TestLabel {
            param([string]$Identity)
            $match = [regex]::Match($Identity.Trim(), '^(?:-\[)?(?<suite>[A-Za-z0-9_.$]+)[ ./](?<method>test[A-Za-z0-9_]+)(?:\(\))?\]?$')
            if ($match.Success) {
              $suite = ($match.Groups["suite"].Value -split "\.")[-1]
              return "$suite.$($match.Groups["method"].Value)"
            }
            $method = [regex]::Match($Identity, '\btest[A-Za-z0-9_]+\b')
            if ($method.Success) { return $method.Value }
            return "unparsed_test_identity"
          }
          function Get-SourceLocation {
            param([string]$SourcePath, [string]$SourceLine, [string]$SourceColumn)
            try {
              $trimChars = [char[]]@([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)
              $workspaceRoot = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd($trimChars)
              $fullPath = [System.IO.Path]::GetFullPath($SourcePath)
              $workspacePrefix = $workspaceRoot + [System.IO.Path]::DirectorySeparatorChar
              if ($fullPath.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $relativePath = $fullPath.Substring($workspacePrefix.Length).Replace('\', '/')
              } else {
                $relativePath = [System.IO.Path]::GetFileName($fullPath)
              }
              if ($relativePath -notmatch '\.swift$') { $relativePath = '<source>' }
              $position = $SourceLine
              if ($SourceColumn) { $position += ':' + $SourceColumn }
              return $relativePath + ':' + $position
            } catch {
              $position = $SourceLine
              if ($SourceColumn) { $position += ':' + $SourceColumn }
              return '<source>:' + $position
            }
          }
          function Get-SafeCompilerMessage {
            param([string]$Message)
            $safeMessage = $Message.Trim()
            $safeMessage = [regex]::Replace($safeMessage, '(?i)github_pat_[A-Za-z0-9_]{20,}|\bgh[pousr]_[A-Za-z0-9]{20,}\b|\bsk-[A-Za-z0-9]{20,}\b', '<redacted>')
            $safeMessage = [regex]::Replace($safeMessage, '(?i)\bBearer\s+\S+', 'Bearer <redacted>')
            $safeMessage = [regex]::Replace($safeMessage, '(?i)\b(Runtime[_ -]?Key|api[_ -]?key|token|cookie)\b\s*[:=]\s*\S+', '$1=<redacted>')
            $safeMessage = [regex]::Replace($safeMessage, '(?i)(?:[A-Z]:[\\/]|\\\\)[^\r\n]+|/(?:Users|home)/[^\r\n]+', '<path>')
            if ($safeMessage.Length -gt 240) { $safeMessage = $safeMessage.Substring(0, 240) }
            return $safeMessage
          }
          $currentTestName = "unknown_test"
          $sawTestOutput = $false
          $assertionDiagnosticCount = 0
          $uncaughtTestErrorCount = 0
          $compilerDiagnosticCount = 0
          foreach ($line in $swiftOutput) {
            $text = [regex]::Replace([string]$line, '\x1B\[[0-?]*[ -/]*[@-~]', '')
            if ($text -match 'Test (Suite|Case) ') { $sawTestOutput = $true }
            $caseMatch = [regex]::Match($text, "Test Case '([^']+)' (started|passed|failed)\b")
            if ($caseMatch.Success) {
              $testName = ConvertTo-TestLabel -Identity $caseMatch.Groups[1].Value
              $testStatus = $caseMatch.Groups[2].Value
              if ($testStatus -eq "started") {
                $currentTestName = $testName
              } else {
                Write-Output ("TEST name={0} status={1}" -f $testName, $testStatus)
                if ($testStatus -eq "failed") { $currentTestName = $testName }
                else { $currentTestName = "unknown_test" }
              }
            }
            $diagnosticMatch = [regex]::Match($text, '^(?<path>.+?):(?<line>\d+)(?::(?<column>\d+))?:\s*error:\s*(?<message>.*)$')
            if ($diagnosticMatch.Success) {
              $message = $diagnosticMatch.Groups["message"].Value
              $source = Get-SourceLocation -SourcePath $diagnosticMatch.Groups["path"].Value -SourceLine $diagnosticMatch.Groups["line"].Value -SourceColumn $diagnosticMatch.Groups["column"].Value
              $assertionMatch = [regex]::Match($message, '\b(?<assertion>XCTAssert[A-Za-z]+|XCTUnwrap|XCTFail)\b')
              if ($assertionMatch.Success) {
                $testName = $currentTestName
                $identityMatch = [regex]::Match($message, '^(?<identity>.+?)\s*:\s*(?:XCTAssert[A-Za-z]+|XCTUnwrap|XCTFail)\b')
                if ($identityMatch.Success) { $testName = ConvertTo-TestLabel -Identity $identityMatch.Groups["identity"].Value }
                $assertion = $assertionMatch.Groups["assertion"].Value
                $reason = switch ($assertion) {
                  "XCTAssertEqual" { "equality_mismatch"; break }
                  "XCTAssertNotEqual" { "unexpected_equality"; break }
                  "XCTAssertNil" { "expected_nil"; break }
                  "XCTAssertNotNil" { "expected_non_nil"; break }
                  "XCTAssertTrue" { "expected_true"; break }
                  "XCTAssertFalse" { "expected_false"; break }
                  "XCTUnwrap" { "unexpected_nil"; break }
                  "XCTFail" { "explicit_failure"; break }
                  default { "assertion_failed" }
                }
                Write-Output ("TEST_DIAGNOSTIC test={0} source={1} category=xctest_assertion assertion={2} reason={3} values=redacted" -f $testName, $source, $assertion, $reason)
                $assertionDiagnosticCount++
              } elseif (-not $sawTestOutput) {
                $compilerDiagnosticCount++
                $compilerCategory = "swift_compiler_error"
                if ($message -match 'no such module') { $compilerCategory = "swift_no_such_module" }
                elseif ($message -match 'cannot find') { $compilerCategory = "swift_symbol_not_found" }
                elseif ($message -match 'failed to build module') { $compilerCategory = "swift_module_build_failure" }
                $safeMessage = Get-SafeCompilerMessage -Message $message
                Write-Output ("COMPILER_DIAGNOSTIC source={0} category={1} message={2}" -f $source, $compilerCategory, $safeMessage)
              } else {
                Write-Output ("TEST_DIAGNOSTIC test={0} source={1} category=xctest_error reason=uncaught_test_error" -f $currentTestName, $source)
                $uncaughtTestErrorCount++
              }
            } elseif ($text -match '^\s*error:\s*(?<message>.*)$') {
              if ($sawTestOutput) {
                Write-Output ("TEST_DIAGNOSTIC test={0} source=<location-unavailable> category=xctest_error reason=unhandled_test_error" -f $currentTestName)
                $uncaughtTestErrorCount++
              } else {
                $compilerDiagnosticCount++
                $safeMessage = Get-SafeCompilerMessage -Message $Matches["message"]
                Write-Output ("COMPILER_DIAGNOSTIC source=<location-unavailable> category=swift_compiler_error message={0}" -f $safeMessage)
              }
            }
          }
          Write-Output ("DIAGNOSTIC_SUMMARY assertions={0} test_errors={1} compiler_errors={2}" -f $assertionDiagnosticCount, $uncaughtTestErrorCount, $compilerDiagnosticCount)
          $summaryLine = $swiftOutput | Where-Object { [string]$_ -match "Executed \d+ tests?, with \d+ failures?" } | Select-Object -Last 1
          $summaryText = [string]$summaryLine
          $summaryMatch = [regex]::Match($summaryText, 'Executed (\d+) tests?, with (\d+) failures?')
          if (-not $summaryLine -or -not $summaryMatch.Success) {
            Write-Output "ERROR_CATEGORY=swift_test_summary_missing"
            if ($swiftExitCode -ne 0) { exit $swiftExitCode }
            exit 1
          }
          $executed = [int]$summaryMatch.Groups[1].Value
          $failures = [int]$summaryMatch.Groups[2].Value
          Write-Output "TEST_SUMMARY executed=$executed failures=$failures"
          if ($swiftExitCode -ne 0) {
            if ($failures -gt 0) { Write-Output "ERROR_CATEGORY=swift_test_assertion_failure" }
            else { Write-Output "ERROR_CATEGORY=swift_test_command_failed" }
            exit $swiftExitCode
          }
          if ($executed -lt 11) {
            Write-Output "ERROR_CATEGORY=swift_test_discovery_or_zero_tests"
            exit 1
          }
          if ($failures -ne 0) {
            Write-Output "ERROR_CATEGORY=swift_test_assertion_failure"
            exit 1
          }
          Write-Output "SWIFT_TEST_STATUS=PASS"
      - name: Set up Python for Schema validation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.11"
      - name: Install pinned Schema validator
        shell: pwsh
        run: |
          $pipOutput = & python -m pip install --disable-pip-version-check --no-input --only-binary=:all: -r .github/ci/mcp-schema-requirements.txt 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "ERROR_CATEGORY=schema_dependency_install"
            exit 1
          }
          Write-Output "SCHEMA_VALIDATOR_SETUP=PASS"
      - name: Validate actual captured MCP route responses
        shell: pwsh
        run: |
          & python .github/scripts/validate-mcp-route-captures.py
          if ($LASTEXITCODE -ne 0) {
            Write-Output "ERROR_CATEGORY=actual_route_schema_validation"
            exit $LASTEXITCODE
          }

  # Gate B1 only: hosted checks cover L1/L2; block Service launch unless L4 is proven.
  mcp-exe-process-tests:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/mcp-cache-hints-exe-process-20261105' && inputs.architecture == 'x64'
    name: MCP executable process regression (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      SWIFT_VERSION: 6.3.3
      TARGET_TRIPLE: x86_64-unknown-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic egress recovery state tests
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\tests\Test-McpEgressGuardRecovery.ps1"'
      - name: Verify fresh Windows x64 runner
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne "X64" -or
              -not [Environment]::Is64BitProcess) {
            Write-Output "ERROR_CATEGORY=runner_not_windows_x64"
            exit 1
          }
          $existing = @(Get-Process -ErrorAction Stop | Where-Object {
            $_.ProcessName -match '^(codex[-_.]?bridge|tunnel-client)'
          })
          if ($existing.Count -gt 0) {
            Write-Output "ERROR_CATEGORY=existing_bridge_process"
            exit 1
          }
          try {
            $pipes = @(Get-ChildItem -LiteralPath "\\.\pipe\" -ErrorAction Stop)
          } catch {
            Write-Output "ERROR_CATEGORY=named_pipe_namespace_unavailable"
            exit 1
          }
          $bridgePipes = @($pipes | Where-Object { $_.Name -match '^org\.codexbridge\.service\.' })
          if ($bridgePipes.Count -gt 0) {
            Write-Output "ERROR_CATEGORY=existing_bridge_ipc_endpoint"
            exit 1
          }
          $appSupport = [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData)
          if ([string]::IsNullOrWhiteSpace($appSupport) -or (Test-Path -LiteralPath (Join-Path $appSupport "CodexBridge"))) {
            Write-Output "ERROR_CATEGORY=legacy_configuration_present_or_unavailable"
            exit 1
          }
          $credentialTargets = @(& "$env:SystemRoot\System32\cmdkey.exe" /list 2>$null | ForEach-Object {
            if ([string]$_ -match '^\s*Target:\s*(?<target>.+)$') { $Matches.target.Trim() }
          })
          if ($LASTEXITCODE -ne 0 -or ($credentialTargets -match 'com\.openai\.codex-bridge\.secrets')) {
            Write-Output "ERROR_CATEGORY=preexisting_bridge_credential_target"
            exit 1
          }
          Write-Output "PASS test=runner-preflight architecture=x64 bridge_processes=0 bridge_pipes=0 legacy_root=absent"
      - name: Install Swift toolchain
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\setup-windows-swift.ps1" -Version $env:SWIFT_VERSION'
      - name: Prepare Windows Swift test libraries
        shell: pwsh
        run: |
          $triplet = "x64-windows"
          $vcpkgRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$triplet"
          $vcpkgOutput = & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "sqlite3:$triplet" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "ERROR_CATEGORY=vcpkg_sqlite_setup"
            exit 1
          }
          . "$env:GITHUB_WORKSPACE\Scripts\windows-build-environment.ps1"
          $buildEnvironment = Get-WindowsBuildEnvironment -Architecture "x64"
          $includePaths = @((Join-Path $vcpkgRoot "include")) + $buildEnvironment.IncludePaths
          $libraryPaths = @((Join-Path $vcpkgRoot "lib")) + $buildEnvironment.LibraryPaths
          Add-Content $env:GITHUB_ENV "INCLUDE=$($includePaths -join ';')"
          Add-Content $env:GITHUB_ENV "TARGET_LIBRARY_PATHS=$($libraryPaths -join ';')"
          Add-Content $env:GITHUB_ENV "LIB=$($libraryPaths -join ';')"
          Add-Content $env:GITHUB_PATH (Join-Path $vcpkgRoot "bin")
          Write-Output "PASS test=windows-swift-test-libraries architecture=x64"
      - name: Resolve pinned SwiftPM dependencies
        shell: pwsh
        run: |
          $resolveOutput = & swift package --package-path Packages/BridgeCore resolve 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "ERROR_CATEGORY=swift_dependency_resolution"
            exit 1
          }
          Write-Output "PASS test=swiftpm-resolve"
      - name: Download and verify approved portable build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\prepare-mcp-process-artifact.ps1"'
      - name: Verify path firewall rules and independent probe (L1-L2)
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\guard-mcp-exe-egress.ps1" -Mode Apply'
      - name: Require process-tree egress isolation before Service launch
        if: always()
        shell: pwsh
        run: |
          $statePath = Join-Path $env:RUNNER_TEMP "codex-bridge-b1-egress-state.json"
          if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) {
            Write-Output "BLOCKED stage=service-start error_category=recovery_state_missing"
            exit 1
          }
          try {
            $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json -AsHashtable
          } catch {
            Write-Output "BLOCKED stage=service-start error_category=recovery_state_invalid"
            exit 1
          }
          if ($state.network.levels.L4 -ne "PASS" -or $state.network.serviceStartAllowed -ne $true) {
            Write-Output "BLOCKED stage=service-start error_category=process_tree_egress_isolation_unavailable"
            exit 1
          }
          Write-Output "PASS stage=service-start security_level=L4"
      - name: Run Windows EXE process-level XCTest
        if: success() && env.CODEX_BRIDGE_B1_ISOLATION_LEVEL == 'L4_PASS'
        working-directory: Packages/BridgeCore
        timeout-minutes: 35
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\invoke-mcp-exe-process-tests.ps1"'
      - name: Set up Python for fixed MCP Schema validation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.11"
      - name: Install pinned Schema validator
        shell: pwsh
        run: |
          $pipOutput = & python -m pip install --disable-pip-version-check --no-input --only-binary=:all: -r .github/ci/mcp-schema-requirements.txt 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "ERROR_CATEGORY=schema_dependency_install"
            exit 1
          }
          Write-Output "PASS test=schema-validator-setup"
      - name: Validate actual EXE MCP responses against fixed Schema
        if: success() && env.CODEX_BRIDGE_B1_ISOLATION_LEVEL == 'L4_PASS'
        shell: pwsh
        run: |
          & python .github/scripts/validate-mcp-process-captures.py
          if ($LASTEXITCODE -ne 0) {
            Write-Output "ERROR_CATEGORY=actual_process_schema_validation"
            exit $LASTEXITCODE
          }
      - name: Stop only the verified candidate and restore runner guard
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\guard-mcp-exe-egress.ps1" -Mode Cleanup'
